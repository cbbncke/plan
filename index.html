<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>目标倒计时</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg1:#1a1a2e;--bg2:#16213e;--card-bg:rgba(30,30,46,0.85);--card-bd:rgba(255,255,255,0.08);--t1:#fff;--t2:rgba(255,255,255,0.7);--t3:rgba(255,255,255,0.45);--acc:#00d4aa;--dng:#ff6b6b;--tb-bg:rgba(26,26,46,0.7);--modal-bg:#1e1e2e;--inp-bg:rgba(255,255,255,0.08);--inp-bd:rgba(255,255,255,0.15);--ov-bg:rgba(0,0,0,0.5);--shd:0 4px 24px rgba(0,0,0,0.25);--tab-bg:rgba(26,26,46,0.85);--tab-active:#00d4aa;--tab-inactive:rgba(255,255,255,0.4)}
[data-theme="light"]{--bg1:#e8f5e9;--bg2:#c8e6c9;--card-bg:rgba(255,255,255,0.92);--card-bd:rgba(0,0,0,0.06);--t1:#1a1a2e;--t2:rgba(26,26,46,0.7);--t3:rgba(26,26,46,0.45);--acc:#2e7d32;--dng:#c62828;--tb-bg:rgba(232,245,233,0.85);--modal-bg:#fff;--inp-bg:rgba(0,0,0,0.05);--inp-bd:rgba(0,0,0,0.12);--ov-bg:rgba(0,0,0,0.35);--shd:0 4px 24px rgba(0,0,0,0.08);--tab-bg:rgba(232,245,233,0.85);--tab-active:#2e7d32;--tab-inactive:rgba(26,26,46,0.4)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg1);color:var(--t1);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg1) 100%);background-attachment:fixed}
[data-theme="light"] body{background:linear-gradient(160deg,#c8e6c9 0%,#a5d6a7 40%,#81c784 70%,#66bb6a 100%);background-attachment:fixed}

.toolbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 8px;background:var(--tb-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:100}
.toolbar-btn{width:42px;height:42px;border:none;background:rgba(255,255,255,0.12);color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background 0.2s}
[data-theme="light"] .toolbar-btn{background:rgba(0,0,0,0.06)}
.toolbar-btn:hover{background:rgba(255,255,255,0.2)}
[data-theme="light"] .toolbar-btn:hover{background:rgba(0,0,0,0.1)}
.toolbar-title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:0.3px}
.toolbar-right{display:flex;gap:6px}

.tab-bar{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;background:var(--tab-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:100;border-top:1px solid var(--card-bd);padding:0 16px;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--tab-inactive);font-size:11px;font-weight:600;cursor:pointer;transition:color 0.2s;letter-spacing:0.3px;padding:6px 0}
.tab-item .tab-icon{font-size:22px;line-height:1;transition:transform 0.2s}
.tab-item.active{color:var(--tab-active)}
.tab-item.active .tab-icon{transform:scale(1.1)}

.card-list,.memo-list{padding:68px 14px 80px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 112px)}
.search-bar{position:fixed;top:56px;left:0;right:0;padding:10px 14px;background:var(--tb-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:99;border-bottom:1px solid var(--card-bd)}
.search-input{width:100%;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:12px;padding:10px 16px 10px 38px;color:var(--t1);font-size:14px;outline:none;transition:border-color 0.2s;font-family:inherit}
.search-input:focus{border-color:var(--acc)}
.search-input::placeholder{color:var(--t3)}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--t3);pointer-events:none}
.memo-list.with-search{padding-top:118px}

.card{border-radius:20px;padding:20px 22px 20px 22px;padding-right:40px;border:1px solid var(--card-bd);box-shadow:var(--shd);cursor:pointer;transition:transform 0.2s ease;position:relative;overflow:hidden}
.card:active{transform:scale(0.97)}
.card.expired{opacity:0.55}
.card.expired::after{content:'已到期';position:absolute;top:14px;right:14px;background:var(--dng);color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0}
.card-title{font-size:17px;font-weight:700;color:var(--t1);flex:1;line-height:1.3;letter-spacing:0.2px}
.card-countdown{display:flex;align-items:baseline;gap:3px;white-space:nowrap;margin-left:12px;flex-shrink:0}
.countdown-label{font-size:12px;color:var(--t2);font-weight:500}
.countdown-number{font-size:38px;font-weight:800;line-height:1;color:var(--acc);letter-spacing:-1px}
.countdown-unit{font-size:13px;color:var(--t2);font-weight:500}

.card-emoji-wrap{display:flex;justify-content:center;padding:12px 0 8px}
.card-emoji{font-size:48px;line-height:1}

.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card-note{font-size:13px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-target-date{font-size:12px;color:var(--t3);margin-left:8px;white-space:nowrap;flex-shrink:0}

.card-sort{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;opacity:0.7;transition:opacity 0.2s}
.card:hover .card-sort{opacity:1}
.sort-btn{width:24px;height:24px;border:none;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.85);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
.sort-btn:hover{background:var(--acc);color:#fff}
.sort-btn:disabled{opacity:0.25;pointer-events:none}
[data-theme="light"] .sort-btn{background:rgba(0,0,0,0.1);color:rgba(0,0,0,0.6)}
[data-theme="light"] .sort-btn:hover{background:var(--acc);color:#fff}

.card-dark{background:linear-gradient(145deg,rgba(25,25,40,0.92),rgba(15,15,25,0.95));color:#fff}
.card-dark .card-title,.card-dark .card-note,.card-dark .card-target-date{color:rgba(255,255,255,0.85)}
.card-dark .countdown-number{color:#00d4aa}
.card-green{background:linear-gradient(145deg,rgba(27,94,32,0.88),rgba(46,125,50,0.85));color:#fff}
.card-green .card-title,.card-green .card-note,.card-green .card-target-date{color:rgba(255,255,255,0.85)}
.card-green .countdown-number{color:#a5d6a7}
.card-blue{background:linear-gradient(145deg,rgba(144,202,249,0.8),rgba(207,216,220,0.75));color:#fff}
.card-blue .card-title,.card-blue .card-note{color:rgba(255,255,255,0.9)}
.card-blue .card-target-date{color:rgba(255,255,255,0.6)}
.card-blue .countdown-number{color:#fff}

.memo-card{border-radius:20px;padding:20px 22px;border:1px solid var(--card-bd);box-shadow:var(--shd);cursor:pointer;transition:transform 0.2s ease;position:relative;overflow:hidden;background:var(--card-bg)}
.memo-card:active{transform:scale(0.97)}
.memo-card-title{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:8px;line-height:1.3}
.memo-card-content{font-size:14px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.memo-card-time{font-size:11px;color:var(--t3);margin-top:10px;text-align:right}
.memo-card-delete{position:absolute;top:12px;right:12px;width:28px;height:28px;border:none;background:rgba(255,107,107,0.15);color:var(--dng);border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s}
.memo-card:hover .memo-card-delete{opacity:1}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 32px;text-align:center}
.empty-icon{font-size:56px;margin-bottom:20px}
.empty-text{font-size:18px;font-weight:600;color:var(--t1);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--t3);margin-bottom:28px}
.btn-primary{background:var(--acc);color:#fff;border:none;padding:12px 28px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.15s}
.btn-primary:hover{opacity:0.85}
.btn-secondary{background:var(--inp-bg);color:var(--t1);border:1px solid var(--inp-bd);padding:12px 28px;border-radius:14px;font-size:15px;cursor:pointer}
.btn-danger{background:transparent;color:var(--dng);border:1px solid var(--dng);padding:12px 28px;border-radius:14px;font-size:15px;cursor:pointer;width:100%;margin-top:12px}
.btn-danger:hover{background:rgba(255,107,107,0.1)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ov-bg);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.modal{background:var(--modal-bg);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 0}
.modal-title{font-size:19px;font-weight:700;color:var(--t1)}
.modal-close{width:32px;height:32px;border:none;background:var(--inp-bg);color:var(--t2);border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 22px 34px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.form-input,.form-textarea{width:100%;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:12px;padding:12px 16px;color:var(--t1);font-size:15px;outline:none;transition:border-color 0.2s;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:var(--acc)}
.form-textarea{resize:vertical;min-height:100px;line-height:1.5}
.form-input::placeholder,.form-textarea::placeholder{color:var(--t3)}

.emoji-picker{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.emoji-btn{width:40px;height:40px;border:none;background:var(--inp-bg);border-radius:10px;font-size:22px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.emoji-btn:hover,.emoji-btn.selected{background:var(--acc);transform:scale(1.15)}

.color-picker{display:flex;gap:10px;padding:4px 0}
.color-btn{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all 0.15s}
.color-btn:hover,.color-btn.selected{transform:scale(1.15);border-color:var(--t1)}

.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ov-bg);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
.confirm-box{background:var(--modal-bg);border-radius:20px;padding:28px 24px;width:100%;max-width:320px;text-align:center}
.confirm-text{font-size:16px;font-weight:600;color:var(--t1);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:12px}
.confirm-btns .btn-secondary,.confirm-btns .btn-primary{flex:1;text-align:center}
.confirm-btns .btn-danger{margin-top:0;border:none;padding:12px 28px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--dng);color:#fff}
.confirm-btns .btn-danger:hover{opacity:0.85}

.page{display:none}
.page.active{display:block}

.fab{position:fixed;right:20px;bottom:76px;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,212,170,0.4);z-index:90;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(0.95)}

.swipe-delete{overflow:hidden;position:relative}
</style>
</head>
<body>

<div class="toolbar">
  <div style="width:42px"></div>
  <div class="toolbar-title" id="toolbarTitle">🎯 目标倒计时</div>
  <div class="toolbar-right">
    <button class="toolbar-btn" id="themeToggle" title="切换主题">🌙</button>
  </div>
</div>

<div id="countdownPage" class="page active">
  <div class="card-list" id="cardList"></div>
</div>

<div id="memoPage" class="page">
  <div class="search-bar" id="searchBar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="memoSearch" placeholder="搜索备忘录..." oninput="onMemoSearch()">
    </div>
  </div>
  <div class="memo-list with-search" id="memoList"></div>
</div>

<button class="fab" id="fabBtn">＋</button>

<div class="tab-bar">
  <button class="tab-item active" data-tab="countdown">
    <span class="tab-icon">🎯</span>
    <span>倒计时</span>
  </button>
  <button class="tab-item" data-tab="memo">
    <span class="tab-icon">📝</span>
    <span>备忘录</span>
  </button>
</div>

<div class="modal-overlay" id="countdownModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="countdownModalTitle">新建目标</div>
      <button class="modal-close" onclick="closeCountdownModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">选择图标</label>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="form-group">
        <label class="form-label">目标名称</label>
        <input class="form-input" id="cdTitle" placeholder="例如：期末考试" maxlength="30">
      </div>
      <div class="form-group">
        <label class="form-label">目标日期</label>
        <input class="form-input" id="cdDate" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">备注（可选）</label>
        <input class="form-input" id="cdNote" placeholder="添加备注..." maxlength="100">
      </div>
      <div class="form-group">
        <label class="form-label">卡片颜色</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
      <button class="btn-primary" style="width:100%" onclick="saveCountdown()">保存</button>
      <button class="btn-danger" id="cdDeleteBtn" style="display:none" onclick="deleteCountdown()">删除此目标</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="memoModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="memoModalTitle">新建备忘录</div>
      <button class="modal-close" onclick="closeMemoModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">标题</label>
        <input class="form-input" id="memoTitle" placeholder="备忘录标题" maxlength="50">
      </div>
      <div class="form-group">
        <label class="form-label">内容</label>
        <textarea class="form-textarea" id="memoContent" placeholder="写下你的想法..." rows="6"></textarea>
      </div>
      <button class="btn-primary" style="width:100%" onclick="saveMemo()">保存</button>
      <button class="btn-danger" id="memoDeleteBtn" style="display:none" onclick="deleteMemo()">删除此备忘录</button>
    </div>
  </div>
</div>

<div id="confirmDialog" class="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-text" id="confirmText">确定要删除吗？</div>
    <div class="confirm-btns">
      <button class="btn-secondary" onclick="closeConfirm(false)">取消</button>
      <button class="btn-danger" id="confirmOkBtn">删除</button>
    </div>
  </div>
</div>

<script>
// ===== 数据管理 =====
const STORAGE_KEYS = { countdowns: 'cd_countdowns', memos: 'cd_memos', theme: 'cd_theme' };
const EMOJIS = ['🎯','📚','💼','🏋️','✈️','🎸','💡','🌟','🏆','❤️','🔥','🎵','💻','🎨','💰','🎓','🧪','📸'];
const COLORS = [
  { name: 'dark', class: 'card-dark', gradient: 'linear-gradient(145deg,rgba(25,25,40,0.92),rgba(15,15,25,0.95))' },
  { name: 'green', class: 'card-green', gradient: 'linear-gradient(145deg,rgba(27,94,32,0.88),rgba(46,125,50,0.85))' },
  { name: 'blue', class: 'card-blue', gradient: 'linear-gradient(145deg,rgba(144,202,249,0.8),rgba(207,216,220,0.75))' }
];

function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

let countdowns = loadData(STORAGE_KEYS.countdowns);
let memos = loadData(STORAGE_KEYS.memos);
let editingCD = null;
let editingMemo = null;

// ===== 主题 =====
const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'dark';
if (savedTheme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('themeToggle').textContent = '☀️'; }

document.getElementById('themeToggle').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(STORAGE_KEYS.theme, 'dark');
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem(STORAGE_KEYS.theme, 'light');
    document.getElementById('themeToggle').textContent = '☀️';
  }
});

// ===== Tab 切换 =====
let currentTab = 'countdown';
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('countdownPage').classList.toggle('active', currentTab === 'countdown');
    document.getElementById('memoPage').classList.toggle('active', currentTab === 'memo');
    document.getElementById('toolbarTitle').textContent = currentTab === 'countdown' ? '🎯 目标倒计时' : '📝 备忘录';
    updateFab();
  });
});

function updateFab() {
  document.getElementById('fabBtn').textContent = '＋';
}

document.getElementById('fabBtn').addEventListener('click', () => {
  if (currentTab === 'countdown') openCountdownModal();
  else openMemoModal();
});

// ===== 倒计时渲染 =====
function getDaysLeft(dateStr) {
  const target = new Date(dateStr + 'T23:59:59');
  const now = new Date();
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function renderCountdowns() {
  const list = document.getElementById('cardList');
  if (countdowns.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">还没有目标</div><div class="empty-sub">点击下方 ＋ 按钮添加你的第一个倒计时目标</div></div>`;
    return;
  }
  list.innerHTML = countdowns.map((c, i) => {
    const days = getDaysLeft(c.date);
    const expired = days < 0;
    const colorObj = COLORS.find(cl => cl.name === c.color) || COLORS[0];
    return `<div class="card ${colorObj.class} ${expired ? 'expired' : ''}" onclick="openCountdownModal('${c.id}')" style="background:${colorObj.gradient}">
      <div class="card-top">
        <div class="card-title">${esc(c.title)}</div>
        <div class="card-countdown">
          <span class="countdown-number">${expired ? 0 : days}</span>
          <span class="countdown-unit">天</span>
        </div>
      </div>
      <div class="card-emoji-wrap"><span class="card-emoji">${c.emoji}</span></div>
      <div class="card-bottom">
        <div class="card-note">${c.note ? esc(c.note) : ''}</div>
        <div class="card-target-date">${formatDate(c.date)}</div>
      </div>
      <div class="card-sort" onclick="event.stopPropagation()">
        <button class="sort-btn" onclick="moveCountdown(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button class="sort-btn" onclick="moveCountdown(${i},1)" ${i===countdowns.length-1?'disabled':''}>▼</button>
      </div>
    </div>`;
  }).join('');
}

function moveCountdown(index, dir) {
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= countdowns.length) return;
  [countdowns[index], countdowns[newIndex]] = [countdowns[newIndex], countdowns[index]];
  saveData(STORAGE_KEYS.countdowns, countdowns);
  renderCountdowns();
}

// ===== 倒计时 Modal =====
function openCountdownModal(id) {
  const modal = document.getElementById('countdownModal');
  const isEdit = !!id;
  editingCD = isEdit ? countdowns.find(c => c.id === id) : null;
  document.getElementById('countdownModalTitle').textContent = isEdit ? '编辑目标' : '新建目标';
  document.getElementById('cdDeleteBtn').style.display = isEdit ? 'block' : 'none';

  // emoji picker
  const selectedEmoji = editingCD ? editingCD.emoji : '🎯';
  document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e =>
    `<button class="emoji-btn ${e===selectedEmoji?'selected':''}" onclick="selectEmoji(this,'${e}')">${e}</button>`
  ).join('');

  // color picker
  const selectedColor = editingCD ? editingCD.color : 'dark';
  document.getElementById('colorPicker').innerHTML = COLORS.map(c =>
    `<button class="color-btn ${c.name===selectedColor?'selected':''}" onclick="selectColor(this,'${c.name}')" style="background:${c.gradient};border-color:${c.name===selectedColor?'var(--t1)':'transparent'}"></button>`
  ).join('');

  document.getElementById('cdTitle').value = editingCD ? editingCD.title : '';
  document.getElementById('cdDate').value = editingCD ? editingCD.date : '';
  document.getElementById('cdNote').value = editingCD ? editingCD.note : '';
  modal.style.display = 'flex';
  document.getElementById('cdTitle').focus();
}

function selectEmoji(btn, emoji) {
  document.querySelectorAll('#emojiPicker .emoji-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectColor(btn, color) {
  document.querySelectorAll('#colorPicker .color-btn').forEach(b => { b.classList.remove('selected'); b.style.borderColor = 'transparent'; });
  btn.classList.add('selected');
  btn.style.borderColor = 'var(--t1)';
}

function getSelectedEmoji() {
  const sel = document.querySelector('#emojiPicker .emoji-btn.selected');
  return sel ? sel.textContent : '🎯';
}

function getSelectedColor() {
  const sel = document.querySelector('#colorPicker .color-btn.selected');
  if (!sel) return 'dark';
  const idx = Array.from(document.querySelectorAll('#colorPicker .color-btn')).indexOf(sel);
  return COLORS[idx] ? COLORS[idx].name : 'dark';
}

function saveCountdown() {
  const title = document.getElementById('cdTitle').value.trim();
  const date = document.getElementById('cdDate').value;
  if (!title || !date) { alert('请填写标题和目标日期'); return; }

  const colorName = getSelectedColor();

  const data = {
    id: editingCD ? editingCD.id : uid(),
    title,
    date,
    note: document.getElementById('cdNote').value.trim(),
    emoji: getSelectedEmoji(),
    color: colorName,
    createdAt: editingCD ? editingCD.createdAt : new Date().toISOString()
  };

  if (editingCD) {
    const idx = countdowns.findIndex(c => c.id === editingCD.id);
    if (idx >= 0) countdowns[idx] = data;
  } else {
    countdowns.unshift(data);
  }
  saveData(STORAGE_KEYS.countdowns, countdowns);
  closeCountdownModal();
  renderCountdowns();
}

function deleteCountdown() {
  if (!editingCD) return;
  showConfirm('确定要删除此目标吗？此操作不可撤销。', () => {
    countdowns = countdowns.filter(c => c.id !== editingCD.id);
    saveData(STORAGE_KEYS.countdowns, countdowns);
    closeCountdownModal();
    renderCountdowns();
  });
}

function closeCountdownModal() {
  document.getElementById('countdownModal').style.display = 'none';
  editingCD = null;
}

// ===== 备忘录渲染 =====
let memoSearchQuery = '';

function onMemoSearch() {
  memoSearchQuery = document.getElementById('memoSearch').value.trim().toLowerCase();
  renderMemos();
}

function renderMemos() {
  const list = document.getElementById('memoList');
  const filtered = memoSearchQuery
    ? memos.filter(m => (m.title || '').toLowerCase().includes(memoSearchQuery) || (m.content || '').toLowerCase().includes(memoSearchQuery))
    : memos;

  if (filtered.length === 0) {
    const isSearch = !!memoSearchQuery;
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">${isSearch ? '🔍' : '📝'}</div><div class="empty-text">${isSearch ? '没有找到匹配的备忘录' : '还没有备忘录'}</div><div class="empty-sub">${isSearch ? '试试其他关键词' : '点击下方 ＋ 按钮记录你的想法'}</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(m => `
    <div class="memo-card" onclick="openMemoModal('${m.id}')">
      <button class="memo-card-delete" onclick="event.stopPropagation();quickDeleteMemo('${m.id}')" title="删除">🗑</button>
      <div class="memo-card-title">${highlightText(m.title || '无标题', memoSearchQuery)}</div>
      <div class="memo-card-content">${highlightText(m.content, memoSearchQuery)}</div>
      <div class="memo-card-time">${formatTime(m.updatedAt || m.createdAt)}</div>
    </div>
  `).join('');
}

function highlightText(text, query) {
  if (!query) return esc(text);
  const escaped = esc(text);
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(`(${q})`, 'gi'), '<mark style="background:rgba(0,212,170,0.3);color:inherit;border-radius:3px;padding:0 2px">$1</mark>');
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff/60000)} 分钟前`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)} 小时前`;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ===== 备忘录 Modal =====
function openMemoModal(id) {
  const modal = document.getElementById('memoModal');
  const isEdit = !!id;
  editingMemo = isEdit ? memos.find(m => m.id === id) : null;
  document.getElementById('memoModalTitle').textContent = isEdit ? '编辑备忘录' : '新建备忘录';
  document.getElementById('memoDeleteBtn').style.display = isEdit ? 'block' : 'none';
  document.getElementById('memoTitle').value = editingMemo ? editingMemo.title : '';
  document.getElementById('memoContent').value = editingMemo ? editingMemo.content : '';
  modal.style.display = 'flex';
  document.getElementById('memoTitle').focus();
}

function saveMemo() {
  const title = document.getElementById('memoTitle').value.trim();
  const content = document.getElementById('memoContent').value.trim();
  if (!content && !title) { alert('请填写标题或内容'); return; }

  const now = new Date().toISOString();
  const data = {
    id: editingMemo ? editingMemo.id : uid(),
    title: title || '无标题',
    content,
    createdAt: editingMemo ? editingMemo.createdAt : now,
    updatedAt: now
  };

  if (editingMemo) {
    const idx = memos.findIndex(m => m.id === editingMemo.id);
    if (idx >= 0) memos[idx] = data;
  } else {
    memos.unshift(data);
  }
  saveData(STORAGE_KEYS.memos, memos);
  closeMemoModal();
  renderMemos();
}

function quickDeleteMemo(id) {
  const m = memos.find(x => x.id === id);
  showConfirm(`确定要删除「${m ? m.title : ''}」吗？`, () => {
    memos = memos.filter(x => x.id !== id);
    saveData(STORAGE_KEYS.memos, memos);
    renderMemos();
  });
}

function deleteMemo() {
  if (!editingMemo) return;
  showConfirm('确定要删除此备忘录吗？此操作不可撤销。', () => {
    memos = memos.filter(m => m.id !== editingMemo.id);
    saveData(STORAGE_KEYS.memos, memos);
    closeMemoModal();
    renderMemos();
  });
}

function closeMemoModal() {
  document.getElementById('memoModal').style.display = 'none';
  editingMemo = null;
}

// ===== 确认弹窗 =====
let confirmCb = null;
function showConfirm(text, cb) {
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmDialog').style.display = 'flex';
  confirmCb = cb;
  document.getElementById('confirmOkBtn').onclick = () => { closeConfirm(true); };
}
function closeConfirm(ok) {
  document.getElementById('confirmDialog').style.display = 'none';
  if (ok && confirmCb) confirmCb();
  confirmCb = null;
}

// ===== 工具函数 =====
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ===== 点击 overlay 关闭弹窗 =====
document.getElementById('countdownModal').addEventListener('click', function(e) {
  if (e.target === this) closeCountdownModal();
});
document.getElementById('memoModal').addEventListener('click', function(e) {
  if (e.target === this) closeMemoModal();
});

// ===== 初始化 =====
renderCountdowns();
renderMemos();

// 每分钟刷新倒计时
setInterval(() => { if (currentTab === 'countdown') renderCountdowns(); }, 60000);
</script>
